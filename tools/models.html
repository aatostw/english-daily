<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>城市建築：各階外觀</title>
<style>
body{margin:0;font:14px system-ui,sans-serif;background:#D6EAE5;color:#23313a}
h1{font-size:18px;margin:12px 16px 4px}p{margin:0 16px 10px;color:#5b6b75}
.wrap{position:relative;margin:0 8px 16px}
.grid{display:grid;grid-template-columns:80px repeat(7,1fr);gap:0}
.grid div{height:var(--h);border:1px solid rgba(0,0,0,.06);font-size:12px;padding:4px;box-sizing:border-box}
.grid .rh{display:flex;align-items:center;font-weight:700}
.grid .ch{height:26px;text-align:center;font-weight:700}
canvas{position:absolute;left:80px;top:26px;pointer-events:none}
nav{margin:0 16px 8px}nav a{margin-right:10px}
</style></head><body>
<h1>城市建築：各階外觀</h1>
<p>每一列是一種建築，每一欄是一個時代（市中心的階）。</p>
<nav><a href="?i=0">每個時代第 1 級</a><a href="?i=1">第 2 級</a><a href="?i=2">第 3 級</a></nav>
<div class="wrap"><div class="grid" id="grid"></div></div>
<script>window.S = {}; window.$ = s => document.querySelector(s);</script>
<script type="module">
/* always the newest files (skip caches) */
for (const f of ["city.js", "city3d.js", "city3d-tiers.js"]) await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "../js/" + f + "?t=" + Date.now(); s.onload = ok; s.onerror = no; document.head.appendChild(s); });
const T = await import(THREE_URL);
const q = new URLSearchParams(location.search), I = Math.max(0, Math.min(2, Number(q.get("i") ?? 2))), N = HALL_TIERS.length;
const ROWS = ["hall", "house", "farm", "park", "cafe", "books", "clinic", "landmark"];
const grid = document.getElementById("grid"), W = Math.min(1100, innerWidth - 16), cw = (W - 80) / N, ch = Math.round(cw * 1.25);
grid.style.setProperty("--h", ch + "px");
grid.innerHTML = '<div class="ch"></div>' + ERA_NAMES.map(n => '<div class="ch">' + n + '</div>').join("");
const C = City3D; C.T = T; C.mats = {};
const r = new T.WebGLRenderer({antialias:true, alpha:true}); r.setPixelRatio(Math.min(devicePixelRatio, 2));
r.setSize(cw * N, ch * ROWS.length); r.outputColorSpace = T.SRGBColorSpace; r.toneMapping = T.ACESFilmicToneMapping; r.setScissorTest(true);
document.querySelector(".wrap").appendChild(r.domElement);
const scene = new T.Scene(); scene.add(new T.HemisphereLight(0xfff6e6, 0x86b3a6, 1.15));
const sun = new T.DirectionalLight(0xfff0d6, 2.3); sun.position.set(7, 13, 6); scene.add(sun);
const win = C.mat(0xFFF1C4, {emissive:0xFFC864, emissiveIntensity:0});
const cam = new T.PerspectiveCamera(30, cw / ch, .1, 100);
ROWS.forEach((type, row) => {
  for (let t = 1; t <= N; t++){
    const lv = (t - 1) * 3 + 1 + I, name = type === "hall" ? HALL_TIERS[t - 1] : type === "landmark" ? LANDMARK_LOOKS[t - 1] : lookName(type, lv);
    grid.insertAdjacentHTML("beforeend", (t === 1 ? '<div class="rh">' + CITY_BUILDINGS[type].name + "</div>" : "") + "<div>" + name + " Lv" + lv + "</div>");
    const g = new T.Group(), base = new T.Mesh(new T.CylinderGeometry(.95, 1, .3, 6), C.mat(0xE6DCCB)); base.position.y = -.17; g.add(base);
    const bg = new T.Group(); bg.position.y = .03; g.add(bg);
    try { C.building(bg, type, win, false, lv); }
    catch (e) { grid.lastElementChild.textContent += " ⚠ " + e.message; console.error(e); }
    scene.add(g); g.visible = false;
    const box = new T.Box3().setFromObject(g), h = Math.max(1.4, box.max.y);
    cam.position.set(2.6, 1.2 + h * .9, 3.4).multiplyScalar(Math.max(1, h / 1.6) * .9); cam.lookAt(0, h * .38, 0);
    g.visible = true;
    const x = (t - 1) * cw, y = (ROWS.length - 1 - row) * ch;
    r.setViewport(x, y, cw, ch); r.setScissor(x, y, cw, ch); r.render(scene, cam);
    g.visible = false;
  }
});
document.title += " ✓";
</script>
</body></html>
