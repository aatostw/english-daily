<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#39648D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>每日英文練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Plan: one phone-width column on a white page, light theme only. Top bar, scrolling view, bottom tabs.
     Blue = actions and structure, green = sentence patterns and "done", yellow = this week's words. */
  --primary:#39648D;
  --primary-text:#39648D;
  --primary-soft:#E4EDF6;
  --green:#48A88B;
  --green-text:#2C7A63;
  --green-soft:#E1F2EC;
  --yellow:#F3CC58;
  --yellow-soft:#FBEFC6;
  --ink:#1E2B38;
  --muted:#5D6F81;
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --field:#EDF1F5;
  --line:#DFE6ED;
  --paper:#FFFFFF;
  --paper-ink:#1E2B38;
  --paper-line:#DFE6ED;
  --danger:#B5463C;
  --shadow:0 1px 2px rgba(30,43,56,.05),0 8px 24px rgba(30,43,56,.06);
  --font-en:"Lexend","Noto Sans TC",system-ui,sans-serif;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Lexend",system-ui,sans-serif;
  --read-size:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary-text)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px;border-radius:8px}
[hidden]{display:none !important}
.en{font-family:var(--font-en)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}

/* ---------- shell ---------- */
.app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto;position:relative;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.top .name{font-weight:700;font-size:17px;letter-spacing:.02em}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;background:var(--field);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--green-soft);color:var(--green-text)}
.pill.warn{background:var(--yellow-soft);color:var(--ink)}
.pill.warn::before{background:#C99A17}
.pill.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
main{flex:1;overflow-y:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px 8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:12px;font-weight:500}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--primary-text);font-weight:700}
.tab[aria-current="page"] svg{stroke-width:2.2}

/* ---------- building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card.flat{box-shadow:none}
.label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--primary);color:#fff;text-decoration:none;min-height:46px;transition:transform .08s ease,filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.block{width:100%}
.btn.soft{background:var(--field);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--primary-text);padding:10px 12px}
.btn.green{background:var(--green)}
.btn.danger{background:var(--danger)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:0;background:var(--field);color:var(--ink);flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.on{background:var(--yellow);color:#2B2520}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--field);font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.chip.word{background:var(--yellow-soft);color:var(--ink);font-family:var(--font-en);font-weight:500;border:0;font-size:14px;padding:6px 12px}
.chip.pat{background:var(--green-soft);color:var(--green-text);font-weight:700}
.chip.done{background:var(--green);color:#fff}
.chip.done::before{content:"✓"}
.tag-a,.tag-b,.tag-r{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;font:700 12px var(--font-en);color:#fff;background:var(--green);flex:none}
.tag-b{background:var(--primary)}
.tag-r{background:#9A7B1F}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.input,select.input,textarea.input{width:100%;border:1px solid transparent;background:var(--field);border-radius:12px;padding:12px 14px;min-height:46px}
textarea.input{resize:vertical;font-family:var(--font-en);line-height:1.5}
.input:focus{border-color:var(--primary);outline:none;background:var(--surface)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--field);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:500;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.note{background:var(--field);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.note.warn{background:var(--yellow-soft);color:var(--ink)}
.err{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);border-radius:12px;padding:10px 14px;font-size:14px}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.divider{height:1px;background:var(--line)}

/* ---------- today / week ---------- */
.hero{background:var(--primary);color:#fff;border:0}
.hero .label{color:rgba(255,255,255,.75)}
.hero h1{font-size:26px;font-weight:900;color:#fff}
.hero .theme-en{font-family:var(--font-en);opacity:.8;font-size:15px}
.hero .pats{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px}
.hero .pats .row{gap:8px;font-family:var(--font-en);font-size:15px}
.hero .tag-b{background:#fff;color:var(--primary)}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:rgba(255,255,255,.75)}
.dot i{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700}
.dot.read i{background:var(--green);border-color:var(--green);color:#fff}
.dot.started i{border-color:#fff}
.dot.today{color:#fff;font-weight:700}
.dot.today i{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
.dot.sun i{border-style:dashed}
.art-card h2{font-family:var(--font-en);font-size:22px;font-weight:700}
.art-card .zh{color:var(--muted);margin-top:-6px}
.day-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--field);border:0;width:100%;text-align:left}
.day-row .d{width:46px;flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.day-row .d b{font-size:15px}
.day-row .d span{font-size:12px;color:var(--muted);font-family:var(--font-en)}
.day-row .t{flex:1;min-width:0}
.day-row .t .en{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-row .t .sub{font-size:13px;color:var(--muted)}
.day-row.locked{opacity:.55;cursor:default}
.day-row.today-row{background:var(--yellow-soft)}
.status{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface);color:var(--muted);flex:none}
.status.read{background:var(--green);color:#fff}
.pattern-card{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--field)}
.pattern-card .en{font-weight:600;font-size:17px}
.ex-line{font-family:var(--font-en)}
.word-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.word-row:last-child{border-bottom:0}
.word-row .w-main{flex:1;min-width:0}
.word-row .w-en{font-family:var(--font-en);font-weight:600;font-size:17px}
.word-row .w-ipa{font-family:var(--font-en);color:var(--muted);font-size:13px;margin-left:6px;font-weight:400}
.word-row .w-zh{font-size:14px;color:var(--muted)}
.star{color:#C99A17}
.progress{height:8px;border-radius:99px;background:var(--field);overflow:hidden}
.progress span{display:block;height:100%;background:var(--green);border-radius:99px}

.banner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:16px;padding:14px 16px;background:var(--yellow);color:#2B2520;box-shadow:var(--shadow)}
.banner .banner-ic{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.55);display:grid;place-items:center;flex:none}
.banner .banner-ic svg{width:20px;height:20px}
.banner b{display:block;font-size:16px}
.banner small{display:block;font-size:13px;opacity:.8;line-height:1.4}
.banner .chev{margin-left:auto;font-size:26px;line-height:1;flex:none}

.banner.alt{background:var(--primary-soft);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2.tight{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:8px}
@media (max-width:480px){.grid2:not(.tight){grid-template-columns:1fr}}
.field .row .input{flex:1;min-width:0}
.task-row{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.note.ok{background:var(--green-soft);color:var(--green-text)}
label.btn{cursor:pointer}
.ai-card .field label{font-size:14px;color:var(--muted)}
.dd{position:relative}
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--field);border:0;border-radius:12px;padding:12px 14px;min-height:48px;font-size:16px;color:var(--ink);text-align:left}
.dd-btn .chev{flex:none;color:var(--muted);transition:transform .15s}
.dd-btn[aria-expanded="true"]{background:color-mix(in srgb,var(--primary) 10%,var(--field))}
.dd-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.dd-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 14px 36px rgba(30,43,56,.16),0 0 0 1px var(--line)}
.dd-opt{display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:10px;padding:13px 12px;text-align:left;font-size:16px;color:var(--ink);font-family:inherit}
.dd-opt:hover{background:var(--field)}
.dd-opt[aria-selected="true"]{background:var(--primary-soft);font-weight:600}
.dd-opt .check{margin-left:auto;color:var(--primary-text);display:grid}
.coin-icon{width:18px;height:18px;border-radius:50%;vertical-align:-3px;flex:none}
.paid-badge{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#F5B301;color:#fff;font:700 11px/1 var(--font-en);vertical-align:-3px;flex:none}
.switch-row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);cursor:pointer}
.switch-row input{width:20px;height:20px;accent-color:var(--green);flex:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--field);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stats b{font:700 22px var(--font-en);color:var(--primary-text);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.card.backup{border-color:var(--yellow);background:var(--yellow-soft);box-shadow:none}

/* ---------- onboarding (css) ---------- */
.onb h1{font-size:26px;font-weight:900}
.how{display:grid;gap:10px}
.how .row{align-items:flex-start;background:var(--field);border-radius:14px;padding:12px}
.how .n{width:30px;height:30px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--font-en)}
.how .n.g{background:var(--green)}
.how .n.y{background:var(--yellow);color:#2B2520}
.stage{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;width:100%}
.stage[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.stage .ex{font-family:var(--font-en);font-size:15px}
.stage .exzh{font-size:13px;color:var(--muted);margin-top:-6px}
.theme-btn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.theme-btn[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.theme-btn b{display:block}
.theme-btn span{font-family:var(--font-en);font-size:14px;color:var(--muted)}
.steps{display:flex;gap:6px}
.steps i{height:5px;flex:1;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--primary)}

/* ---------- reading ---------- */
.reader{position:absolute;inset:0;background:var(--paper);color:var(--paper-ink);display:flex;flex-direction:column;z-index:20}
.reader-top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--paper-line);background:var(--paper)}
.reader-top .icon-btn{background:color-mix(in srgb,var(--paper-ink) 7%,transparent);color:var(--paper-ink)}
.reader-top .icon-btn.on{background:var(--yellow);color:#2B2520}
.reader-top .ttl{flex:1;min-width:0;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader-body{flex:1;overflow-y:auto;padding:22px 20px 40px;display:flex;flex-direction:column;gap:18px}
.reader-body .meta{display:flex;gap:6px;flex-wrap:wrap}
.reader-body .meta .chip{background:color-mix(in srgb,var(--paper-ink) 8%,transparent);color:var(--paper-ink)}
.reader-title{font-family:var(--font-en);font-size:calc(var(--read-size) + 8px);font-weight:700;line-height:1.2}
.reader-title-zh{color:color-mix(in srgb,var(--paper-ink) 65%,transparent);margin-top:-10px;font-size:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:color-mix(in srgb,var(--paper-ink) 70%,transparent)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:10px;border-radius:3px;display:inline-block}
.text{font-family:var(--font-en);font-size:var(--read-size);line-height:1.7;font-weight:500;display:flex;flex-direction:column;gap:.9em;max-width:62ch}
.para{position:relative;padding-right:44px;border-radius:12px;transition:background .2s}
.para p{margin:0}
.para.playing{background:color-mix(in srgb,var(--yellow) 22%,transparent);box-shadow:0 0 0 8px color-mix(in srgb,var(--yellow) 22%,transparent)}
.para .say{position:absolute;right:0;top:2px;width:34px;height:34px;border-radius:10px;border:0;background:color-mix(in srgb,var(--paper-ink) 7%,transparent);color:var(--paper-ink);display:grid;place-items:center}
.para .say svg{width:17px;height:17px}
.w{cursor:pointer;border-radius:4px;transition:background .12s}
.w:hover{background:color-mix(in srgb,var(--paper-ink) 10%,transparent)}
.w.picked{background:var(--primary);color:#fff}
.kw{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--yellow) 75%,transparent) 58%);font-weight:700;cursor:pointer;padding:0 1px}
.pt{border-bottom:2.5px solid var(--green);background:color-mix(in srgb,var(--green) 13%,transparent);border-radius:3px;padding:0 1px}
.cursor::after{content:"▍";color:var(--primary-text);animation:blink 1s steps(2) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.reader .card{background:var(--surface);color:var(--ink)}
.writing{display:flex;align-items:center;gap:10px;color:color-mix(in srgb,var(--paper-ink) 70%,transparent);font-size:15px}

/* ---------- sheet & dialog ---------- */
.sheet{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(10,16,22,.42);border:0;padding:0;cursor:default}
.sheet-card{position:relative;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;padding:10px 18px 22px;max-height:82%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.18);animation:up .2s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 2px}
.sh-head{display:flex;align-items:flex-start;gap:12px}
.sh-word{font-family:var(--font-en);font-size:30px;font-weight:700;line-height:1.1;word-break:break-word}
.sh-ipa{font-family:var(--font-en);color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.sh-say{display:flex;gap:8px;margin-left:auto}
.sh-say .icon-btn{width:44px;height:44px}
.slow{font-size:12px;font-weight:700}
.ctx-box{background:var(--yellow-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.ctx-box b{font-size:17px}
.sh-zh{font-size:17px;font-weight:500}
.ex-box{border-left:3px solid var(--primary);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}
.ex-box .en{font-size:16px}
.ex-box .zh{font-size:14px;color:var(--muted)}
.pat-box{background:var(--green-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.pat-box .en{font-weight:600;color:var(--green-text)}
.sent-box{background:var(--field);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.sent-box .en{font-size:15px}
.links{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--field),var(--line),var(--field));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.dialog{position:absolute;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(10,16,22,.45)}
.dialog .card{max-width:380px;width:100%}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:88%;text-align:center;box-shadow:var(--shadow)}

/* ---------- talk ---------- */
.chat{display:flex;flex-direction:column;gap:12px}
.bubble{max-width:86%;padding:12px 14px;border-radius:18px;font-family:var(--font-en);font-size:17px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.bubble.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:6px}
.bubble .who{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--font-ui);font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.bubble .who button{border:0;background:var(--field);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;color:var(--ink)}
.bubble .who svg{width:15px;height:15px}
.dock{padding:10px 16px 10px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.dock .row{align-items:flex-end}
.dock textarea{min-height:46px;max-height:140px}
.score{display:flex;gap:3px}
.score i{width:14px;height:14px;border-radius:4px;background:var(--line)}
.score i.on{background:var(--yellow)}
.fix{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:12px;background:var(--field)}
.fix .from{font-family:var(--font-en);text-decoration:line-through;text-decoration-color:var(--danger);color:var(--muted)}
.fix .to{font-family:var(--font-en);font-weight:600;color:var(--green-text)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
@media (min-width:640px){
  .app{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}

/* ---- user's style: flat pages, centered blue titles, bottom action bar ---- */
h1,h2{color:var(--primary-text)}
.btn{box-shadow:0 3px 0 color-mix(in srgb,var(--primary) 70%,#000)}
.btn.soft,.btn.ghost{box-shadow:none}
.btn.green{box-shadow:0 3px 0 color-mix(in srgb,var(--green) 70%,#000)}
.btn.danger{box-shadow:0 3px 0 color-mix(in srgb,var(--danger) 70%,#000)}
.steps{gap:4px;padding:4px 4px 0}
.steps i{height:8px;border-radius:99px;background:var(--line)}
.card.onb{border:0;box-shadow:none;background:transparent;text-align:center;align-items:center;padding:24px 8px 8px}
.card.onb h1{font-size:26px;font-weight:900}
.stage{border:0;background:transparent;text-align:center;align-items:center;color:var(--muted)}
.stage[aria-pressed="true"]{background:var(--surface);color:var(--primary-text);box-shadow:0 4px 18px rgba(30,43,56,.14)}
.stage[aria-pressed="true"] b{font-size:18px}
.dock.onb-nav{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;background:#F2F4FB;border-top:0;margin:0 12px;border-radius:14px 14px 0 0;padding:16px 16px 22px}
.onb-nav .back{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:1;min-height:48px;border:0;border-radius:12px;background:#F2F4FB;color:#7C8A99;font:600 11px var(--font-en)}
.dock.onb-nav.solo{justify-content:center}
.onb-nav .back svg{width:15px;height:15px;stroke-width:2.6}
.onb-nav .next{flex:none;width:66%;min-height:48px;font-size:16px;border-radius:12px;box-shadow:0 4px 0 #2A4A68}
.coins{position:relative;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--yellow-soft);font:700 14px var(--font-en);color:#6B5310}
.coin-pop{position:absolute;right:6px;top:-4px;font:700 15px var(--font-en);color:#C99A17;animation:pop 1.3s ease-out forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.ledger{background:var(--field);border-radius:12px;padding:10px 14px}
.ledger summary{cursor:pointer;font-weight:700;font-size:14px}
.ledger .row{padding:6px 0;border-bottom:1px solid var(--line)}
.ledger .pos{color:var(--green-text)}.ledger .neg{color:var(--danger)}
.seg.tiers{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
.sh-word.phrase{font-size:20px;line-height:1.4;font-weight:600}
</style>
</head>

async function readSSE(res, onData){
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;){
    const r = await reader.read();
    if (r.done) break;
    buf += dec.decode(r.value, {stream:true});
    let i;
    while ((i = buf.indexOf("\n")) >= 0){
      const line = buf.slice(0, i).replace(/\r$/, ""); buf = buf.slice(i + 1);
      if (!line.startsWith("data:")) continue;
      const data = line.slice(5).trim();
      if (!data || data === "[DONE]") continue;
      let obj; try { obj = JSON.parse(data); } catch (e) { continue; }
      onData(obj);
    }
  }
}

/* Ask the chosen model. When it is busy, wait and try once more;
   on Gemini, then move on to the other free models. */
async function callAI(task, input, opts){
  opts = opts || {};
  const cfg = taskCfg(task), p = cfg.provider;
  if (!provKey(p) && p !== "custom") throw {code:"no_key", provider:p};
  if (!provBase(p)) throw {code:"no_base", provider:p};
  const first = String(cfg.model || "").trim();
  if (!first) throw {code:"no_model", provider:p};
  const chain = [first];
  if (p === "gemini") GEMINI_FREE.forEach(m => { if (!chain.includes(m) && chain.length < 4) chain.push(m); });
  let lastErr = null;
  for (let i = 0; i < chain.length; i++){
    const tries = i === 0 ? 2 : 1;
    for (let t = 0; t < tries; t++){
      let streamed = false;
      const o2 = Object.assign({}, opts, {onText: x => { streamed = true; if (opts.onText) opts.onText(x); }});
      try {
        const r = await callModel(p, chain[i], input, o2);
        if (i > 0) toast(modelName(p, first) + " 太忙了，這次改用 " + modelName(p, chain[i]));
        return r;
      } catch (e) {
        lastErr = e;
        if (streamed || !busyErr(e) || (opts.signal && opts.signal.aborted)) throw e;
        if (t + 1 < tries) await sleep(1500);
      }
    }
    if (p !== "gemini") break;
  }
  throw lastErr;
}
async function callModel(p, model, input, opts){
  const P = PROVIDERS[p];
  const turns = toTurns(input), key = provKey(p), base = provBase(p);
  let text = "";
  const push = t => { if (!t) return; text += t; if (opts.onText) opts.onText({text, delta:t}); };
  try {
    let res;

      const body = {contents:turns.map(t => ({role:t.role === "assistant" ? "model" : "user", parts:[{text:t.content}]}))};
      if (opts.json) body.generationConfig = {responseMimeType:"application/json"};
      res = await fetch(base + "/models/" + encodeURIComponent(model) + ":streamGenerateContent?alt=sse&key=" + encodeURIComponent(key),
        {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), signal:opts.signal});
      if (!res.ok) throw await httpErr(res);
      await readSSE(res, o => {
        if (o.error) throw {code:"http", status:o.error.code || 500, message:o.error.message};
        const c = (o.candidates || [])[0] || {};
        ((c.content || {}).parts || []).forEach(pt => { if (pt.text && !pt.thought) push(pt.text); });
        if (!text && /SAFETY|PROHIBITED|BLOCKLIST/.test(c.finishReason || "")) throw {code:"refused"};
      });
    } else if (P.kind === "anthropic"){
      res = await fetch(base + "/messages", {method:"POST", signal:opts.signal,
        headers:{"Content-Type":"application/json", "x-api-key":key, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model, max_tokens:4096, stream:true, messages:turns})});
      if (!res.ok) throw await httpErr(res);
      await readSSE(res, o => {
        if (o.type === "error") throw {code:"http", status:529, message:(o.error || {}).message};
        if (o.type === "content_block_delta" && o.delta && o.delta.type === "text_delta") push(o.delta.text);
      });
    } else if (P.kind === "openai-responses"){
      res = await fetch(base + "/responses", {method:"POST", signal:opts.signal,
        headers:{"Content-Type":"application/json", Authorization:"Bearer " + key},
        body:JSON.stringify({model, stream:true, input:turns.map(t => ({role:t.role, content:t.content}))})});
      if (!res.ok) throw await httpErr(res);
      await readSSE(res, o => {
        if (o.type === "error" || o.type === "response.failed") throw {code:"http", status:500, message:(o.error || (o.response || {}).error || {}).message || o.message};
        if (o.type === "response.output_text.delta" && typeof o.delta === "string") push(o.delta);
      });
    } else {
      const headers = {"Content-Type":"application/json"};
      if (key) headers.Authorization = "Bearer " + key;
      res = await fetch(base + "/chat/completions", {method:"POST", headers, signal:opts.signal, body:JSON.stringify({model, stream:true, messages:turns})});
      if (!res.ok) throw await httpErr(res);
      await readSSE(res, o => {
        if (o.error) throw {code:"http", status:o.error.code || 500, message:o.error.message};
        const d = ((o.choices || [])[0] || {}).delta || {};
        if (typeof d.content === "string") push(d.content);
      });
    }
  } catch (e) {
    if (e && e.name === "AbortError") throw {code:"cancelled", text};
    if (e && e.code) throw e;
    throw {code:"network", provider:p};
  }
  if (!text.trim()) throw {code:"empty"};
  return {text, truncated:false};
}
function parseLoose(t){

    "Role-play rules. You are " + sc.partner_name + " (" + sc.partner_role_zh + "). Situation: " + sc.situation_zh + " The learner is " + sc.learner_role_zh + ".",
    "The learner, an adult in Taiwan at level " + levelText() + ", is practising this week's English. Patterns: " + patList(w) + ". Words: " + w.words.map(x => x.en).join(", ") + ".",
    "- Stay in character. Reply in 1-3 short, simple sentences, then ask something that invites the learner to use the patterns or words.",
    "- Do not correct mistakes during the chat; feedback comes at the end. If you cannot understand, ask them to say it another way.",
    "- If the learner writes Chinese, answer in simple English and gently encourage English.",
    "- Plain text only, no stage directions."
  ].join("\n");
}
function feedbackPrompt(w, conv){
  const tr = conv.turns.map(t => (t.role === "assistant" ? conv.scenario.partner_name : "Learner") + ": " + t.content).join("\n");
  return [
    "Review this English role-play by an adult learner in Taiwan (level " + levelText() + ").",
    "Patterns of the week: " + patList(w),
    "Words of the week: " + wordList(w),
    "Transcript:",
    tr,
    "",
    "Reply with only JSON. All Chinese in Traditional Chinese (Taiwan).",
    '{"score":4,"summary_zh":"<2-3 warm, specific sentences>","words_used":[0,2],"patterns_used":["A"],"patterns_weak":["B"],"corrections":[{"original":"<learner sentence>","better":"<improved>","why_zh":"<short reason>"}],"try_next_zh":"<one concrete suggestion>"}',
    "score 1-5. words_used: numbers of target words the learner used. patterns_weak: labels of patterns the learner did not use or used wrongly. corrections: at most 5, the most useful ones."
  ].join("\n");
}

/* =========================================================
   Article parsing and rendering
   ========================================================= */
function parseRaw(text){
  const t = text.replace(/\r/g, "");
  const get = re => { const m = t.match(re); return m ? m[1].trim() : ""; };
  const title = get(/TITLE:\s*(.+)/);
  const title_zh = get(/TITLE_ZH:\s*(.+)/);
  let body = "", practice = "";
  const bi = t.search(/BODY:\s*/);
  if (bi >= 0){
    const rest = t.slice(bi).replace(/^BODY:\s*/, "");
    const pi = rest.search(/\n\s*PRACTICE:/);
    body = (pi >= 0 ? rest.slice(0, pi) : rest).trim();
    if (pi >= 0) practice = rest.slice(pi).replace(/^\s*PRACTICE:\s*/, "").trim();
    else body = body.replace(/\n\s*P(R(A(C(T(I(C(E(:)?)?)?)?)?)?)?)?\s*$/, "").trim();
  }
  return {title:title.replace(/^TITLE_ZH:.*/, ""), title_zh, body, practice};
}
function cleanBraces(s){ return s.replace(/\{\{|\}\}|\(\(|\)\)|\*\*/g, "").replace(/\|\d+\b/g, ""); }
function parseSegs(p){
  p = p.replace(/\*\*([^*|]+)\|(\d+)\*\*/g, "{{$1|$2}}").replace(/\[\[([^\]|]+)\|(\d+)\]\]/g, "{{$1|$2}}");
  p = p.replace(/\{\{([^{}|]*)(?:\|[^{}]*)?$/, "$1").replace(/\(\(([^()|]*)(?:\|[^()]*)?$/, "$1");
  const re = /\{\{([^{}|]+)\|([^{}]*)\}\}|\(\(([^()|]+)\|([^()]*)\)\)/g;
  const out = []; let last = 0, m;
  while ((m = re.exec(p))){
    if (m.index > last) out.push({t:"plain", text:cleanBraces(p.slice(last, m.index))});
    if (m[1] !== undefined) out.push({t:"kw", text:m[1], ref:m[2].trim()});
    else out.push({t:"pt", text:m[3], ref:m[4].trim()});
    last = re.lastIndex;
  }
  if (last < p.length) out.push({t:"plain", text:cleanBraces(p.slice(last))});
  return out;
}
function stripMarkup(p){ return parseSegs(p).map(s => s.text).join(""); }
function resolveKw(text, ref, words){
  const n = parseInt(ref, 10);
  if (!isNaN(n) && words[n]) return n;
  const low = text.toLowerCase();
  const i = words.findIndex(w => low.includes(w.en.toLowerCase().slice(0, Math.max(3, w.en.length - 2))));
  return i;
}
/* Returns HTML for the body; remembers sentences and paragraphs for taps and speech. */
function renderBody(body, ctxId, opts){
  const ctx = S.ctx[ctxId] = {sentences:[], paras:[], words:opts.words || [], pats:opts.pats || {}};
  const paras = body.replace(/\r/g, "").trim().split(/\n\s*\n/).map(p => p.replace(/\n/g, " ").trim()).filter(Boolean);
  let si = 0, html = "";
  paras.forEach((p, pi) => {
    ctx.paras[pi] = stripMarkup(p);
    let buf = "", inner = "";
    for (const seg of parseSegs(p)){
      let sh = "";
      const parts = seg.text.split(/([A-Za-z][A-Za-z'’-]*)/);
      for (let i = 0; i < parts.length; i++){
        const t = parts[i]; if (!t) continue;
        if (i % 2 === 1){ sh += '<span class="w" data-s="' + si + '">' + esc(t) + "</span>"; buf += t; }
        else {
          sh += esc(t); buf += t;
          if (/[.!?…]["”’)\]]*(\s|$)/.test(t) && buf.trim()){ ctx.sentences[si] = buf.trim(); si++; buf = ""; }
        }
      }
      if (seg.t === "kw"){
        const k = resolveKw(seg.text, seg.ref, ctx.words);
        inner += '<span class="kw" data-k="' + (k >= 0 ? k : "") + '">' + sh + "</span>";
      } else if (seg.t === "pt"){
        inner += '<span class="pt" data-p="' + esc(seg.ref) + '">' + sh + "</span>";
      } else inner += sh;
    }
    if (buf.trim()){ ctx.sentences[si] = buf.trim(); si++; }
    html += '<div class="para" data-pi="' + pi + '"><p>' + inner + (opts.cursor && pi === paras.length - 1 ? '<span class="cursor"></span>' : "") + '</p><button class="say" data-act="say-para" data-pi="' + pi + '" aria-label="朗讀這段">' + ICON.speaker + "</button></div>";
  });
  return '<div class="text" data-ctx="' + ctxId + '">' + html + "</div>";
}

function renderPill(){
  renderCoins();
  const p = $("#pill");
  const m = {local:["ok","本機儲存"], memory:["bad","不會儲存"], loading:["","載入中"]}[S.mode] || ["", ""];
  p.className = "pill " + m[0]; p.textContent = m[1];
}
function render(){
  renderPill();
  const main = $("#main"), tabs = $("#tabs");
  document.documentElement.style.setProperty("--read-size", FONT[set().font] || FONT.m);
  const dock = $("#dock"), draftEl = $("#talk-input");
  if (draftEl) S.talk.draft = draftEl.value;
  if (!S.profile){
    tabs.hidden = true; main.innerHTML = renderOnboarding();
    const st = S.onb.step, last = st === 2;
    dock.className = "dock onb-nav" + (S.onb.step === 0 ? " solo" : ""); dock.hidden = false;
    dock.innerHTML = (st > 0 ? '<button class="back" data-act="onb-back">' + ICON.back + '<span>Back</span></button>' : "") +
      '<button class="btn next" data-act="' + (last ? "onb-finish" : "onb-next") + '">' + (last ? (provReady(aiState().provider) ? "開始使用" : "先跳過") : "繼續") + ' <span aria-hidden="true">→</span></button>';
    return;
  }
  dock.className = "dock";
  tabs.hidden = false;
  tabs.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.v === S.view ? "page" : "false"));
  const fn = {today:renderToday, week:renderWeek, talk:renderTalk, words:renderWords, prefs:renderPrefs}[S.view] || renderToday;
  const keepScroll = render.lastView === S.view ? main.scrollTop : 0;
  main.innerHTML = fn();
  main.scrollTop = keepScroll;
  render.lastView = S.view;
  const dh = dockHTML(); dock.innerHTML = dh; dock.hidden = !dh;
  if (S.view === "talk" && S.talk.scrollDown){ S.talk.scrollDown = false; main.scrollTop = main.scrollHeight; }
}
function go(view){
  S.view = view;
  if (location.hash !== "#" + view){ try { history.replaceState(null, "", "#" + view); } catch (e) { location.hash = view; } }
  render.lastView = null;
  render();
}

function themeChoices(){
  if (!S.pick){
    const used = new Set((S.profile && S.profile.usedThemes) || []);
    const pool = THEMES.filter(t => !used.has(t.zh));
    const src = pool.length >= 3 ? pool : THEMES;
    const picks = [];
    const copy = src.slice();
    while (picks.length < 3 && copy.length) picks.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
    S.pick = {themes:picks, sel:-1, custom:""};
  }
  return S.pick;
}
function themePickerHTML(){
  const pk = themeChoices();
  return '<div class="stack">' + pk.themes.map((t, i) =>
    '<button class="theme-btn" data-act="pick-theme" data-i="' + i + '" aria-pressed="' + (pk.sel === i) + '"><b>' + esc(t.zh) + '</b><span>' + esc(t.en) + "</span></button>").join("") +
    '<div class="row"><button class="btn ghost sm" data-act="shuffle-themes">換一組</button></div>' +
    '<div class="field"><label for="theme-custom">或自己輸入主題</label><input class="input" id="theme-custom" maxlength="40" placeholder="例如：準備去日本玩、跟主管談加薪" value="' + esc(pk.custom) + '"></div></div>';
}
function pickedTheme(){
  const pk = S.pick; if (!pk) return null;
  const c = ($("#theme-custom") && $("#theme-custom").value.trim()) || pk.custom.trim();
  if (c) return {zh:c, en:c};
  return pk.sel >= 0 ? pk.themes[pk.sel] : null;
}
function renderOnboarding(){
  const o = S.onb;
  const steps = '<div class="steps" aria-hidden="true"><i class="on"></i><i class="' + (o.step >= 1 ? "on" : "") + '"></i><i class="' + (o.step >= 2 ? "on" : "") + '"></i></div>';

      "</section>" +

          '<div class="reader-title" style="font-size:22px">' + esc(SAMPLE.title) + '</div><div class="muted small" style="margin:2px 0 12px">' + esc(SAMPLE.title_zh) + "</div>" +
          renderBody(SAMPLE.body, "sample", {words:SAMPLE.words, pats:SAMPLE.pats}) +
        "</div></section>" +
      '<label class="btn ghost block" for="import-file">換手機了？匯入進度檔</label><input type="file" id="import-file" accept="application/json,.json,text/plain,.txt" hidden>';
  }
  if (o.step === 1){
    return steps +
      '<section class="card onb"><h1>選擇你的排位</h1><p class="muted" style="margin:0">之後可以在「設定」隨時調整難度。</p></section>' +
      '<div class="stack">' + TIERS.map((t, i) => {
        const open = (S.onb.tierOpen == null ? (S.onb.tier || 0) : S.onb.tierOpen) === i;
        return '<button class="stage' + (open ? " open" : "") + '" data-act="pick-tier" data-i="' + i + '" aria-pressed="' + ((S.onb.tier || 0) === i) + '" aria-expanded="' + open + '">' +
          '<b>' + t.name + '</b><div class="small">' + t.desc + '</div>' +
          (open ? '<div class="ex">' + esc(t.ex) + '</div><div class="exzh">' + esc(t.exZh) + "</div>" : "") +
        "</button>";
      }).join("") + "</div>";
  }
  return steps +
    '<section class="card onb"><h1>連接 AI</h1>' +
    '<p class="muted" style="margin:0">文章、單字解釋和對話都由 AI 產生。</p></section>' +
    aiCardHTML() +
 "";
}

function heroHTML(w){
  const di = dayIdx(w), P = weekPats(w), st = STAGES[stageOf(w.patterns[0])];
  const dots = DAY_NAMES.map((n, d) => {
    const arts = artsOf(w.n, d);
    let cls = "dot";
    if (d === 6){ cls += " sun"; if (S.convs[w.n] && S.convs[w.n].done) cls += " read"; }
    else if (arts.some(a => a.read)) cls += " read";
    else if (arts.length) cls += " started";
    if (d === di) cls += " today";
    return '<div class="' + cls + '"><i>' + (cls.includes("read") ? "✓" : "") + "</i>" + n.slice(1) + "</div>";
  }).join("");
  return '<section class="card hero"><div class="label">第 ' + w.n + " 週 · " + st.name + " · " + md(w.monday) + "–" + md(addDays(w.monday, 6)) + "</div>" +
    "<h1>" + esc(w.theme_zh) + '</h1><div class="theme-en">' + esc(w.theme_en) + "</div>" +
    '<div class="pats"><div class="row"><span class="tag-a">A</span>' + esc(P.A.en) + '</div><div class="row"><span class="tag-b">B</span>' + esc(P.B.en) + "</div></div>" +
    '<div class="dots">' + dots + "</div></section>";
}
function wordChips(w){
  return '<div class="row wrap">' + w.words.map((x, i) => '<button class="chip word" data-act="week-word" data-n="' + w.n + '" data-i="' + i + '">' + esc(x.en) + "</button>").join("") + "</div>";
}
function articleCardHTML(w, d){
  const arts = artsOf(w.n, d);
  const plan = DAY_PLAN[d];
  const busy = S.busy["gen-" + w.n + "-" + d];
  let html = '<section class="card art-card"><div class="row between"><div class="label">' + DAY_NAMES[d] + "的文章 · " + plan.label + "</div></div>";
  if (!arts.length){
    const g = genreFor(d, 0);
    html += '<p style="margin:0">今天是<b>' + GENRE[g] + "</b>，用句型 " + plan.use.filter(u => u !== "R").join("、") + " 和 " + plan.words.length + " 個本週單字寫成，大約 " + (LENGTHS[set().length] || LENGTHS.mid).min + " 分鐘。</p>" +
      '<button class="btn block" data-act="gen" data-n="' + w.n + '" data-d="' + d + '" data-k="0"' + (busy ? " disabled" : "") + ">" + (busy ? '<span class="spinner"></span>正在寫…' : "產生今天的文章") + "</button>";
  } else {
    arts.forEach((a, i) => {
      if (i > 0) html += '<div class="divider"></div>';
      html += '<div class="row wrap"><span class="chip">' + GENRE[a.genre] + "</span>" + (a.read ? '<span class="chip done">讀完了</span>' : "") + "</div>" +
        "<h2>" + esc(a.title) + '</h2><div class="zh">' + esc(a.title_zh) + "</div>" +
        '<button class="btn ' + (a.read ? "soft" : "") + ' block" data-act="open-art" data-id="' + artId(a) + '">' + (a.read ? "再讀一次" : "開始閱讀") + "</button>";
    });
    const k = arts.length;
    html += '<button class="btn ghost" data-act="gen" data-n="' + w.n + '" data-d="' + d + '" data-k="' + k + '"' + (busy ? " disabled" : "") + ">" + (busy ? '<span class="spinner"></span>正在寫…' : "再讀一篇（" + GENRE[genreFor(d, k)] + "）") + "</button>";
  }
  if (S.err["gen-" + w.n + "-" + d]) html += '<div class="err">' + esc(S.err["gen-" + w.n + "-" + d]) + "</div>";
  return html + "</section>";
}
function aiBannerHTML(){
  const miss = aiMissing();

}
function themeNeed(){
  if (!S.profile) return null;
  const w = curWeek();
  if (!w) return {n:1, pair:S.profile.startPair % PAIRS, first:true};
  const conv = S.convs[w.n], di = dayIdx(w);
  const done = !!(conv && conv.done);
  if (done || di >= 6) return {n:w.n + 1, pair:(S.profile.startPair + w.n) % PAIRS, first:false, skip:!done, sunday:di === 6};
  return null;
}
function bannerHTML(need){
  if (!need) return "";
  const sub = need.first ? "選好後，App 會挑出這週的 6 個單字，開始每天的文章。"
    : need.sunday && need.skip ? "週日對話還沒做也可以先選。新的一週從明天開始，今天就能先讀第一篇。"
    : need.sunday ? "新的一週從明天開始，選好今天就能先讀第一篇。"
    : need.skip ? "上週的對話還沒做也可以先選，選了就開始新的一週。"

}
function previewHTML(need){
  const A = PATTERNS[need.pair * 2], B = PATTERNS[need.pair * 2 + 1], st = STAGES[stageOf(need.pair * 2)];
  return '<section class="card"><div class="label">第 ' + need.n + " 週 · " + st.name + "｜" + st.title + "</div><h2>這週要學的句型</h2>" +
    patternCardHTML("A", A) + patternCardHTML("B", B) +
    '<p class="muted small" style="margin:0">選好主題後，週一到週六每天一篇短文，週日用這兩個句型和 6 個單字跟 AI 對話。</p></section>';
}
function dailyHistoryHTML(){
  const today = todayStr(), cw = curWeek(), rows = [];
  Object.values(S.weeks).forEach(w => {
    for (let d = 0; d < 6; d++){
      const date = addDays(w.monday, d);
      if (date >= today) continue;
      const arts = artsOf(w.n, d);
      if (arts.length) arts.forEach(a => rows.push({date, w, d, a}));
      else if (cw && w.n === cw.n) rows.push({date, w, d, a:null});
    }
  });
  if (!rows.length) return "";
  rows.sort((x, y) => x.date < y.date ? 1 : x.date > y.date ? -1 : ((x.a ? x.a.k : 0) - (y.a ? y.a.k : 0)));
  return '<section class="card"><div class="label">每日文章</div><div class="stack">' + rows.map(r => {
    const a = r.a, sub = "第 " + r.w.n + " 週 · " + esc(r.w.theme_zh || "") + " · " + DAY_PLAN[r.d].label;
    return a
      ? '<button class="day-row" data-act="open-art" data-id="' + artId(a) + '"><span class="d"><b>' + DAY_NAMES[r.d] + "</b><span>" + md(r.date) + '</span></span><span class="t"><div class="en">' + esc(a.title) + '</div><div class="sub">' + sub + '</div></span><span class="status' + (a.read ? " read" : "") + '">' + (a.read ? "讀完了" : "未讀完") + "</span></button>"
      : '<button class="day-row" data-act="gen" data-n="' + r.w.n + '" data-d="' + r.d + '" data-k="0"><span class="d"><b>' + DAY_NAMES[r.d] + "</b><span>" + md(r.date) + '</span></span><span class="t"><div class="en">' + GENRE[genreFor(r.d, 0)] + '</div><div class="sub">' + sub + '</div></span><span class="status">' + (S.busy["gen-" + r.w.n + "-" + r.d] ? "產生中" : "點一下產生") + "</span></button>";
  }).join("") + "</div></section>";
}
function renderToday(){ return renderTodayTop() + dailyHistoryHTML(); }

      (done ? "在上方選下週主題，或到「週日對話」再看一次回饋。" : "AI 會扮演一個角色，你盡量用上本週的句型和單字。") + "</p>" +

}

function wordUsed(text, en){
  const toks = en.toLowerCase().split(/\s+/).map(t => t.replace(/[^a-z']/g, "")).filter(Boolean);
  if (!toks.length) return false;
  const stems = toks.map(t => t.length > 4 ? t.replace(/(ing|ed|es|e|s|y)$/, "") : t);
  const re = new RegExp("\\b" + stems.map(s => escRe(s) + "[a-z']*").join("\\s+(?:[a-z']+\\s+){0,2}"), "i");
  return re.test(text);
}
function checklistHTML(w, conv){
  const mine = conv ? conv.turns.filter(t => t.role === "user").map(t => t.content).join("\n").replace(/’/g, "'") : "";
  const P = weekPats(w);
  return '<div class="stack"><div class="row wrap">' + Object.keys(P).map(k => {
    let used = false; try { used = !!mine && new RegExp(P[k].re, "i").test(mine); } catch (e) {}
    return '<span class="chip pat' + (used ? " done" : "") + '">' + k + " · " + esc(P[k].en) + "</span>";
  }).join("") + '</div><div class="row wrap">' + w.words.map((x, i) => {
    const used = !!mine && wordUsed(mine, x.en);
    return '<button class="chip word' + (used ? " done" : "") + '" data-act="week-word" data-n="' + w.n + '" data-i="' + i + '">' + esc(x.en) + "</button>";
  }).join("") + "</div></div>";
}
function feedbackHTML(w, conv){
  const f = conv.feedback; if (!f) return "";
  const score = Math.max(1, Math.min(5, Number(f.score) || 3));
  const usedW = (f.words_used || []).map(Number).filter(i => w.words[i]);
  const missW = w.words.map((_, i) => i).filter(i => !usedW.includes(i));
  const P = weekPats(w);
  return '<section class="card"><div class="row between"><div class="label">這週的回饋</div><div class="score" aria-label="' + score + ' 分（滿分 5）">' + [1,2,3,4,5].map(i => '<i class="' + (i <= score ? "on" : "") + '"></i>').join("") + "</div></div>" +
    '<p style="margin:0">' + esc(f.summary_zh) + "</p>" +
    '<div class="stack"><div class="small"><b>用到的單字</b></div><div class="row wrap">' + (usedW.length ? usedW.map(i => '<span class="chip done">' + esc(w.words[i].en) + "</span>").join("") : '<span class="muted small">這次還沒用到</span>') + "</div>" +
    (missW.length ? '<div class="small"><b>下次試著用</b></div><div class="row wrap">' + missW.map(i => '<button class="chip word" data-act="week-word" data-n="' + w.n + '" data-i="' + i + '">' + esc(w.words[i].en) + "</button>").join("") + "</div>" : "") + "</div>" +
    ((f.patterns_weak || []).filter(k => P[k]).length ? '<div class="note warn">下週會在文章裡再複習：' + f.patterns_weak.filter(k => P[k]).map(k => '<span class="en"><b>' + esc(P[k].en) + "</b></span>").join("、") + "</div>" : "") +
    ((f.corrections || []).length ? '<div class="stack"><div class="small"><b>可以說得更好</b></div>' + f.corrections.slice(0, 5).map(c => '<div class="fix"><span class="from">' + esc(c.original) + '</span><span class="to">' + esc(c.better) + '</span><span class="small muted">' + esc(c.why_zh) + "</span></div>").join("") + "</div>" : "") +
    (f.try_next_zh ? '<div class="note">' + esc(f.try_next_zh) + "</div>" : "") + "</section>";
}

const LOOKUP = new Map((() => { try { return Object.entries(JSON.parse(localStorage.getItem(LS + "lookup") || "{}")); } catch (e) { return []; } })());
function saveLookup(){ try { localStorage.setItem(LS + "lookup", JSON.stringify(Object.fromEntries([...LOOKUP].slice(-400)))); } catch (e) {} }
function cambridge(w){ return "https://dictionary.cambridge.org/dictionary/english-chinese-traditional/" + encodeURIComponent(String(w).toLowerCase().trim().replace(/\s+/g, "-")); }

function tapText(text, id){

function phrasePrompt(text, sentence){
  return [
    "An English learner in Taiwan selected this part of a text and wants it explained.",
    'Selected: "' + text + '"',
    'Context: "' + sentence + '"',
    "Reply with only JSON. All Chinese in Traditional Chinese (Taiwan).",
    '{"zh":"<natural translation of the selected text>","in_context_zh":"<what it means here and any key grammar or phrase worth noticing, 1-2 short sentences>","example_en":"<a new simple sentence using the key phrase>","example_zh":"<its translation>"}'
  ].join("\n");
}
/* Selecting a passage (long-press / drag) opens an explanation of it. */
let selTimer = null, ptrDown = false;
function scheduleSel(){ clearTimeout(selTimer); selTimer = setTimeout(checkSelection, 700); }
document.addEventListener("pointerdown", () => { ptrDown = true; }, true);
["pointerup","touchend","pointercancel"].forEach(ev => document.addEventListener(ev, () => { ptrDown = false; scheduleSel(); }, true));
document.addEventListener("selectionchange", scheduleSel);
function checkSelection(){
  if (ptrDown) return;
  const sel = window.getSelection && window.getSelection();
  if (!sel || sel.isCollapsed) return;
  const text = sel.toString().replace(/\s+/g, " ").trim();
  if (text.length < 2 || text.length > 300 || !/[A-Za-z]/.test(text)) return;
  const n = sel.anchorNode, el = n && (n.nodeType === 1 ? n : n.parentElement);
  if (!el || el.closest("#sheet") || !el.closest("[data-ctx], .fix, .ex-box, .sent-box, .reader-title")) return;
  if (S.sheet && S.sheet.selText === text) return;
  const ctxEl = el.closest("[data-ctx]"), ctx = ctxEl && S.ctx[ctxEl.dataset.ctx];
  const wEl = el.closest(".w") || (ctxEl && ctxEl.querySelector(".w"));
  const sentence = (ctx && wEl && ctx.sentences[Number(wEl.dataset.s)]) || (el.closest(".fix, .ex-box, .sent-box, .para, .reader-title") || el).textContent.trim().slice(0, 400);
  const phrase = /\s/.test(text);
  openSheet({state:"loading", phrase, selText:text, sentence, pat:null, data:{word:text.replace(/^[^A-Za-z]+|[^A-Za-z]+$/g, ""), lemma:""}});
}
function closeSheet(){
  try { if (S.sheet && S.sheet.selText) window.getSelection().removeAllRanges(); } catch (e) {}
  S.sheet = null; $("#sheet").hidden = true; $("#sheet-card").innerHTML = "";
  document.querySelectorAll(".w.picked").forEach(x => x.classList.remove("picked"));
}

    (d.lemma && d.word && d.lemma.toLowerCase() !== d.word.toLowerCase() ? '<span class="small">原形：<span class="en">' + esc(d.lemma) + "</span></span>" : "") + "</div></div>" +

  } else {
    if (d.in_context_zh) html += '<div class="ctx-box"><span class="label">在這句的意思</span><b>' + esc(d.in_context_zh) + "</b></div>";
    if (d.zh) html += '<div class="sh-zh">' + esc(d.zh) + "</div>";

    if (d.example_en) html += '<div class="ex-box"><span class="en">' + esc(d.example_en) + ' <button class="btn ghost sm" style="padding:2px 6px;min-height:0;vertical-align:middle" data-act="say" data-text="' + esc(d.example_en) + '" aria-label="朗讀例句">' + ICON.speaker.replace("<svg", '<svg width="16" height="16"') + '</button></span><span class="zh">' + esc(d.example_zh) + "</span></div>";
  }
  if (o.pat) html += '<div class="pat-box"><span class="label">這裡用了句型</span><span class="en">' + esc(o.pat.en) + '</span><span class="small">' + esc(o.pat.zh) + "</span></div>";
  if (o.sentence){
    html += '<div class="sent-box"><span class="label">整句</span><span class="en">' + esc(o.sentence) + "</span>" +
      (d.sentence_zh ? '<span class="small">' + esc(d.sentence_zh) + "</span>" : (o.state === "ready" ? '<button class="btn ghost sm" style="align-self:flex-start;padding:4px 0" data-act="tr-sent"' + (o.trBusy ? " disabled" : "") + ">" + (o.trBusy ? "翻譯中…" : "翻譯整句") + "</button>" : "")) +
      '<button class="btn ghost sm" style="align-self:flex-start;padding:4px 0" data-act="say" data-text="' + esc(o.sentence) + '">' + ICON.speaker.replace("<svg", '<svg width="16" height="16"') + "唸整句</button></div>";
  }
  html += '<div class="links"><a class="btn soft sm" href="' + cambridge(head) + '" target="_blank" rel="noopener">劍橋字典 ↗</a><a class="btn soft sm" href="' + gtrans(head) + '" target="_blank" rel="noopener">Google 翻譯 ↗</a>' +
    '<button class="icon-btn ' + (starred ? "on" : "") + '" data-act="star" aria-pressed="' + starred + '" aria-label="' + (starred ? "取消收藏" : "收藏") + '"' + (o.state === "loading" ? " disabled" : "") + ">" + (starred ? ICON.starOn : ICON.star) + "</button></div>";
  $("#sheet-card").innerHTML = html;
}
async function lookupWord(o){
  const key = o.data.word.toLowerCase() + "|" + (o.sentence || "");
  if (LOOKUP.has(key)){ o.data = Object.assign({}, o.data, LOOKUP.get(key)); o.state = "ready"; drawSheet(); return; }
  try {
    const r = await aiJson("lookup", o.phrase ? phrasePrompt(o.data.word, o.sentence || o.data.word) : lookupPrompt(o.data.word, o.sentence || o.data.word), {cache:{gcTime:86400000}});
    if (!r || typeof r !== "object") throw {code:"invalid_json"};
    const clean = {};
    ["lemma","ipa","pos","zh","in_context_zh","example_en","example_zh","sentence_zh"].forEach(k => { if (r[k]) clean[k] = String(r[k]); });
    LOOKUP.set(key, clean); saveLookup();
    if (S.sheet !== o) return;
    o.data = Object.assign({}, o.data, clean); o.state = "ready"; drawSheet();
  } catch (e) {
    if (S.sheet !== o) return;
    o.state = "error"; o.err = aiErr(e); drawSheet();
  }
}
function onWordTap(el){
  const ctxEl = el.closest("[data-ctx]"); if (!ctxEl) return;
  const ctx = S.ctx[ctxEl.dataset.ctx]; if (!ctx) return;
  const kwEl = el.closest(".kw");
  const wEl = el.classList.contains("w") ? el : el.querySelector(".w");
  const si = wEl ? Number(wEl.dataset.s) : -1;
  const sentence = ctx.sentences[si] || "";
  const ptEl = el.closest(".pt");
  const pat = ptEl ? ctx.pats[ptEl.dataset.p] || null : null;
  document.querySelectorAll(".w.picked").forEach(x => x.classList.remove("picked"));
  if (wEl && !kwEl) wEl.classList.add("picked");
  if (kwEl && kwEl.dataset.k !== "" && ctx.words[Number(kwEl.dataset.k)]){
    const info = ctx.words[Number(kwEl.dataset.k)];
    openSheet({state:"ready", sentence, pat, data:Object.assign({word:info.en, lemma:info.en}, info)});
  } else {
    const word = (wEl ? wEl.textContent : el.textContent).replace(/’/g, "'");
    openSheet({state:"loading", sentence, pat, data:{word, lemma:""}});
  }
}

async function createWeek(n, monday, pair, review, theme, prof){
  prof = prof || S.profile;
  const pids = [(pair % PAIRS) * 2, (pair % PAIRS) * 2 + 1];
  const r = await aiJson("write", wordsPrompt(theme, pids), {cache:false});
  const words = (r && Array.isArray(r.words) ? r.words : []).filter(x => x && x.en).slice(0, 6).map(x => ({
    en:String(x.en), pos:String(x.pos || ""), ipa:String(x.ipa || ""), zh:String(x.zh || ""), note_zh:String(x.note_zh || ""),
    example_en:String(x.example_en || ""), example_zh:String(x.example_zh || "")
  }));
  if (words.length < 6) throw {code:"invalid_json"};
  const week = {kind:"week", n, monday, pair:pair % PAIRS, patterns:pids, review:review || [], theme_zh:String(r.theme_zh || theme.zh), theme_en:String(r.theme_en || theme.en), words, status:"active", createdAt:Date.now()};
  await Store.set("week-" + n, week);
  S.weeks[n] = week;
  prof.currentWeek = n;
  prof.usedThemes = (prof.usedThemes || []).concat(theme.zh).slice(-30);
  await Store.set("profile", prof);
  return week;

async function startWeek(){
  const need = themeNeed();
  if (!need){ closeSheet(); return; }
  const theme = pickedTheme();
  if (!theme){ toast("先選一個主題，或自己輸入一個。"); return; }
  if (S.busy.week) return;
  S.busy.week = true; S.err.week = ""; drawSheet();
  try {
    const today = todayStr(), w = curWeek();
    let monday;
    if (need.first) monday = mondayOf(today);
    else {
      monday = addDays(w.monday, 7);
      const cm = mondayOf(today);
      if (parseYmd(monday) < parseYmd(cm)) monday = cm;
    }
    if (diffDays(monday, today) >= 6) monday = addDays(monday, 7); // picked on a Sunday: the week starts tomorrow
    if (need.first) await createWeek(1, monday, S.profile.startPair, [], theme);
    else {
      const conv = S.convs[w.n];
      const review = (conv && conv.done && conv.weakPids) || [];
      await createWeek(w.n + 1, monday, S.profile.startPair + w.n, review, theme);
      w.status = "done"; Store.set("week-" + w.n, w).catch(() => {});
    }
    S.pick = null; S.busy.week = false;
    closeSheet(); toast("第 " + need.n + " 週準備好了"); go("today");
  } catch (e) {
    S.busy.week = false; S.err.week = aiErr(e);
    if (S.sheet && S.sheet.kind === "theme") drawSheet(); else toast(S.err.week);
  }
}

/* ---------- learning log + progress file ---------- */
const FILE_FORMAT = "everyday-english-progress", FILE_VERSION = 1;
/* ---------- coins (shared with the in-app mini game later) ---------- */
const DAILY_COIN_CAP = 1000;
function newWallet(){ return {kind:"wallet", balance:0, earned:0, spent:0, ledger:[], items:[], daily:{}, milestones:{}}; }
function wallet(){ if (!S.wallet) S.wallet = newWallet(); return S.wallet; }
/* Adds coins (within today's cap), records why, saves, and shows a "+N" pop. Returns what was given. */
function earn(amount, reason){
  const W = wallet(), d = todayStr(), got = W.daily[d] || 0;
  const give = Math.max(0, Math.min(amount, DAILY_COIN_CAP - got));
  if (!give){ if (amount > 0) toast("今天的金幣已經拿滿 " + DAILY_COIN_CAP + " 了，明天再來！"); return 0; }
  W.balance += give; W.earned += give; W.daily[d] = got + give;
  W.ledger.push({at:Date.now(), amount:give, reason});
  if (W.ledger.length > 500) W.ledger = W.ledger.slice(-500);
  Object.keys(W.daily).forEach(k => { if (diffDays(k, d) > 14) delete W.daily[k]; });
  Store.set("wallet", W).catch(() => {});
  coinPop(give); renderCoins();
  if (S.reader || S.view === "talk") toast("+" + give + " 金幣・" + reason);
  return give;
}
/* For the mini game: spends coins if there are enough. */
function spend(amount, reason, item){
  const W = wallet();
  if (amount <= 0 || W.balance < amount) return false;
  W.balance -= amount; W.spent += amount;
  W.ledger.push({at:Date.now(), amount:-amount, reason});
  if (item) W.items.push(Object.assign({boughtAt:Date.now()}, item));
  Store.set("wallet", W).catch(() => {}); renderCoins();
  return true;
}

  const key = n + "@" + addDays(todayStr(), -(n - 1));

  W.milestones[key] = Date.now();

function streakDays(){

  let d = todayStr();
  if (!active(d)) d = addDays(d, -1);

function buildProgressFile(){
  const weeks = Object.values(S.weeks).sort((a, b) => a.n - b.n).map(w => Object.assign(clone(w), {conversation:S.convs[w.n] ? clone(S.convs[w.n]) : null}));
  const groups = {};
  Object.values(S.arts).forEach(a => {
    const w = S.weeks[a.week], key = a.week + "-" + a.day;
    if (!groups[key]) groups[key] = {date:w ? addDays(w.monday, a.day) : "", week:a.week, day:a.day, weekday:DAY_NAMES[a.day], articles:[]};
    groups[key].articles.push(clone(a));
  });
  const daily = Object.values(groups).sort((a, b) => (a.week - b.week) || (a.day - b.day));
  daily.forEach(g => { g.articles.sort((x, y) => x.k - y.k); g.done = g.articles.some(a => a.read); });
  const profile = clone(S.profile);
  if (profile.settings && profile.settings.pocketVoice) profile.settings.pocketVoice = Object.assign({}, profile.settings.pocketVoice, {wavData:""});
  return {
    format:FILE_FORMAT, version:FILE_VERSION, app:"每日英文練習", exportedAt:new Date().toISOString(),
    summary:progressStats(), profile, weeks, daily,
    log:clone(S.log || {kind:"log", days:{}}),
    wallet:clone(wallet()),
    savedWords:Object.keys(S.bank).map(id => Object.assign({id}, clone(S.bank[id])))
  };
}

  let file = new File([json], progressFileName("json"), {type:"application/json"});
  try { if (!navigator.canShare({files:[file]})) file = new File([json], progressFileName("txt"), {type:"text/plain"}); } catch (e) {}

/* Reads this app's progress file (and the older backup format) into plain lists. */
function readProgressFile(d){
  if (d && d.format === FILE_FORMAT){
    if ((Number(d.version) || 1) > FILE_VERSION) throw "這個進度檔是用比較新版的 App 匯出的，請先更新 App 再匯入。";
    const weeks = [], convs = [], arts = [];
    (d.weeks || []).forEach(w => { const c = w.conversation; const ww = Object.assign({}, w); delete ww.conversation; weeks.push(ww); if (c) convs.push(c); });
    (d.daily || []).forEach(g => (g.articles || []).forEach(a => arts.push(a)));
    const words = (d.savedWords || []).map(x => { const y = Object.assign({}, x); const id = y.id || slug(y.en || "w"); delete y.id; return [id, y]; });
    return {profile:d.profile, weeks, convs, arts, words, log:d.log, wallet:d.wallet, exportedAt:d.exportedAt};
  }
  if (d && d.profile && d.weeks && !d.format){
    return {profile:d.profile, weeks:Object.values(d.weeks), convs:Object.values(d.conversations || {}), arts:Object.values(d.articles || {}), words:Object.entries(d.savedWords || {}), log:null, exportedAt:d.exportedAt};
  }
  throw "這不是「每日英文練習」的進度檔。";
}
async function importProgress(file){

  try { p = readProgressFile(JSON.parse(await file.text())); }
  catch (e) { toast(typeof e === "string" ? e : "讀不懂這個檔案，請確認選的是進度檔。"); return; }
  if (!p.profile || typeof p.profile !== "object" || !Array.isArray(p.weeks)){ toast("這個進度檔不完整，沒辦法匯入。"); return; }
  const when = p.exportedAt ? new Date(p.exportedAt) : null;
  const sum = [
    p.weeks.length ? "第 " + (p.profile.currentWeek || p.weeks.length) + " 週" : "還沒開始第 1 週",
    "已完成 " + p.convs.filter(c => c && c.done).length + " 週",
    p.arts.length + " 篇文章",
    p.words.length + " 個收藏單字",
    ((p.wallet && p.wallet.balance) || 0) + " 金幣"
  ].join("・") + (when && !isNaN(when) ? "（" + (when.getMonth() + 1) + "/" + when.getDate() + " 匯出）" : "");
  if (!(await confirmBox("匯入這個進度檔？", sum + "。匯入後，這支手機目前的進度會被取代，無法復原。API Key 不在進度檔裡，會保留這支手機上的設定。", "匯入並取代", true))) return;
  try {
    for (const kind of ["art","conv","week","word","log","wallet"]) for (const x of await Store.list(kind)) await Store.del(x._id);
    const prof = Object.assign({}, p.profile, {kind:"profile"});
    if (when && !isNaN(when)) prof.lastExportAt = when.getTime();
    await Store.set("profile", prof);
    for (const w of p.weeks) if (w && w.n) await Store.set("week-" + w.n, Object.assign({}, w, {kind:"week"}));
    for (const a of p.arts) if (a && a.week) await Store.set(artId(a), Object.assign({}, a, {kind:"art"}));
    for (const c of p.convs) if (c && c.week) await Store.set("conv-" + c.week, Object.assign({}, c, {kind:"conv"}));
    for (const [id, x] of p.words) await Store.set("word-" + slug(id), Object.assign({}, x, {kind:"word"}));
    await Store.set("log", Object.assign({days:{}}, p.log || {}, {kind:"log"}));
    await Store.set("wallet", Object.assign(newWallet(), p.wallet || {}, {kind:"wallet"}));
  } catch (e) { toast("匯入時出了問題，請再試一次。"); return; }
  S.profile = null; await loadAll();
  toast("匯入完成，歡迎回來！"); go("today");
}
function lastExportText(){
  const t = S.profile && S.profile.lastExportAt;
  if (!t) return "還沒匯出過";
  const d = new Date(t), days = diffDays(ymd(d), todayStr());
  return (d.getMonth() + 1) + "/" + d.getDate() + "（" + (days <= 0 ? "今天" : days === 1 ? "昨天" : days + " 天前") + "）";
}
function backupDueDays(){
  if (!S.profile || !Object.keys(S.weeks).length) return 0;
  const since = S.profile.lastExportAt || S.profile.createdAt || Date.now();
  const days = diffDays(ymd(new Date(since)), todayStr());
  return days >= 7 ? days : 0;
}
function backupButtonsHTML(){
  return '<div class="row wrap"><button class="btn sm" data-act="export-file">匯出進度檔</button>' + (canShareFile() ? '<button class="btn soft sm" data-act="share-file">分享到雲端硬碟、LINE…</button>' : "") + "</div>";
}
function weekBackupCardHTML(conv){
  if (!conv || !conv.done) return "";
  const last = (S.profile && S.profile.lastExportAt) || 0;
  if (last >= (conv.doneAt || 0)) return "";
  return '<section class="card backup"><div class="label">備份提醒</div><b>這週完成了！把進度存一份</b><p class="muted small" style="margin:0">換手機或清除瀏覽器資料時，用這個檔案就能把進度搬回來。</p>' + backupButtonsHTML() + "</section>";
}
function backupNagHTML(){
  const n = backupDueDays();
  if (!n || S.backupSnooze) return "";
  return '<section class="card backup"><div class="row between"><b>已經 ' + n + ' 天沒有備份進度</b><button class="btn ghost sm" data-act="backup-later">稍後</button></div>' + backupButtonsHTML() + "</section>";
}
const ACT = {
  "tab": el => { if (S.reader) closeReader(); closeSheet(); go(el.dataset.v); },
  "onb-next": () => { S.onb.step = Math.min(2, S.onb.step + 1); S.err.week = ""; render(); $("#main").scrollTop = 0; },
  "onb-back": () => { S.onb.step = Math.max(0, S.onb.step - 1); render(); $("#main").scrollTop = 0; },
  "pick-tier": el => { const i = Number(el.dataset.i); S.onb.tier = i; S.onb.tierOpen = i; render(); },
  "set-tier": el => { S.profile.tier = Number(el.dataset.i); saveProfile(); render(); toast("之後的文章會用「" + TIERS[S.profile.tier].name + "」的難度"); },
  "pick-theme": el => { const pk = themeChoices(); pk.sel = Number(el.dataset.i); pk.custom = ""; drawSheet(); },
  "shuffle-themes": () => { S.pick = null; drawSheet(); },
  "pocket-prefetch": async () => {
    if (S.busy.pocketPrefetch) return;
    S.busy.pocketPrefetch = true; render();
    try {
      const {tts} = await TTS.pocketEngine();
      await TTS.pocketVoice(tts);
      toast("下載好了，之後關網路也能唸單字。");
    } catch (e) {
      toast("下載失敗：" + String((e && e.message) || e).slice(0, 100));
    }
    S.busy.pocketPrefetch = false; if (S.view === "prefs") render();
  },
  "pocket-wav-clear": () => {
    const st = set();
    st.pocketVoice = Object.assign({}, st.pocketVoice, {wavData:"", wavName:"", wavSize:0});
    TTS.pocketReset(); saveProfile(); render(); toast("已移除自己的音檔，改回預設聲音。");
  },
  "onb-finish": () => finishOnboarding(),
  "open-theme": () => { S.err.week = ""; openSheet({kind:"theme"}); },
  "start-week": () => startWeek(),
  "gen": el => generateArticle(Number(el.dataset.n), Number(el.dataset.d), Number(el.dataset.k)),
  "open-art": el => { if (el.dataset.id && S.arts[el.dataset.id]) openArticle(el.dataset.id); else if (el.dataset.d) generateArticle(Number(el.dataset.n), Number(el.dataset.d), 0); },
  "close-reader": () => closeReader(),
  "stop-gen": () => { if (S.reader && S.reader.ctl) S.reader.ctl.abort(); },
  "retry-gen": () => { const r = S.reader; closeReader(); generateArticle(r.week, r.day, r.k); },
  "mark-read": () => { const a = S.reader && S.reader.art; if (!a) return; const pi = $("#pr-input"); if (pi && !a.feedback) a.answer = pi.value; const firstRead = !a.read; a.read = true; a.readAt = Date.now(); Store.set(artId(a), a).catch(() => {}); if (firstRead){
    logActivity("read");
    earn(10, "讀完《" + (a.title || "文章") + "》");
    const saved = (a.extraWords || []).filter(x => S.bank[slug(x.en)]).length;
    if (saved) earn(saved, "又讀到 " + saved + " 個收藏單字");
    checkStreakBonus(); checkWeekBonus(S.weeks[a.week]);
  } closeReader(); },
  "practice": () => checkPractice(),
  "read-all": () => readAll(),
  "font-cycle": () => { const order = ["s","m","l"]; const st = set(); st.font = order[(order.indexOf(st.font) + 1) % 3]; document.documentElement.style.setProperty("--read-size", FONT[st.font]); saveProfile(); },
  "say-para": el => sayPara(el),
  "say": el => { TTS.speak(el.dataset.text || "", el.dataset.slow ? 0.6 : set().rate); },
  "say-turn": el => { const w = curWeek(), c = w && S.convs[w.n]; if (c) TTS.speak(c.turns[Number(el.dataset.i)].content, set().rate); },
  "week-word": el => { const w = S.weeks[Number(el.dataset.n)]; const info = w && w.words[Number(el.dataset.i)]; if (info) openSheet({state:"ready", sentence:"", pat:null, data:Object.assign({word:info.en, lemma:info.en}, info)}); },
  "bank-word": el => { const x = S.bank[el.dataset.id]; if (x) openSheet({state:"ready", sentence:x.sentence || "", pat:null, data:Object.assign({word:x.en, lemma:x.en}, x)}); },
  "close-sheet": () => closeSheet(),
  "lookup-retry": () => { const o = S.sheet; if (o){ o.state = "loading"; drawSheet(); lookupWord(o); } },
  "star": () => toggleStar(),
  "tr-sent": () => translateSentence(),
  "talk-start": () => startTalk(),
  "talk-send": () => sendTalk(),
  "talk-end": () => endTalk(),
  "word-filter": el => { S.wordFilter = el.dataset.f; render(); },
  "setting": el => { const st = set(); st[el.dataset.key] = el.dataset.val; saveProfile(); render(); },
  "key-eye": el => { const i = document.getElementById(el.dataset.for); if (i) i.type = i.type === "password" ? "text" : "password"; },
  "dd-toggle": el => { S.dd = S.dd === el.dataset.dd ? null : el.dataset.dd; render(); },
  "dd-pick": el => {
    const a = aiState();
    if (el.dataset.dd === "prov"){ a.provider = el.dataset.val; a.model = PROVIDERS[a.provider].defaults.write || ""; }
    else a.model = el.dataset.val;
    S.dd = null; saveAi(); render();
  },
  "ai-test": () => {
    const a = aiState(), p = a.provider, ki = $("#ai-key"), bi = $("#ai-base"), mi = $("input#ai-model");
    KEYS[p] = Object.assign({}, KEYS[p], {key:ki ? ki.value.trim() : provKey(p), base:bi ? bi.value.trim() : ""});
    if (mi) a.model = mi.value.trim();
    saveKeys(); saveAi(); testProvider(p);
  },
  "export-file": () => exportProgress(),
  "share-file": () => shareProgress(),
  "backup-later": () => { S.backupSnooze = true; render(); },
  "reset": () => resetAll()
};
document.addEventListener("click", e => {
  if (S.dd && !e.target.closest(".dd")){ S.dd = null; render(); if (!e.target.closest("[data-act]")) return; }
  const actEl = e.target.closest("[data-act]");
  if (!actEl){
    const wEl = e.target.closest(".kw, .w");
    if (wEl && wEl.closest("[data-ctx]")) onWordTap(wEl);
    return;
  }
  if (actEl.hasAttribute("disabled")) return;
  const fn = ACT[actEl.dataset.act];
  if (fn){ e.preventDefault(); e.stopPropagation(); fn(actEl, e); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "import-file"){ if (el.files && el.files[0]) importProgress(el.files[0]); el.value = ""; return; }
  const act = el.dataset && el.dataset.actChange; if (!act) return;
  if (act === "pocket-wav"){
    const f = el.files && el.files[0]; el.value = "";
    if (!f || !S.profile) return;
    if (f.size > 8 * 1024 * 1024){ toast("音檔太大了（超過 8 MB），請剪短一點，10-30 秒就夠。"); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const st = set();
      st.pocketVoice = Object.assign({}, st.pocketVoice, {wavData:reader.result, wavName:f.name, wavSize:f.size});
      TTS.pocketReset(); saveProfile(); render();
    };
    reader.onerror = () => toast("讀取音檔失敗，換一個檔案試試。");
    reader.readAsDataURL(f);
    return;
  }
  const a = aiState(), p = a.provider;
  if (act === "ai-key"){ KEYS[p] = Object.assign({}, KEYS[p], {key:el.value.trim()}); saveKeys(); delete S.provTest[p]; return; }
  if (act === "ai-base"){ KEYS[p] = Object.assign({}, KEYS[p], {base:el.value.trim()}); saveKeys(); delete S.provTest[p]; return; }
  if (act === "ai-model-text"){ a.model = el.value.trim(); saveAi(); return; }
  if (act === "ai-fast"){ a.fastLookup = el.checked; saveAi(); return; }
  if (!S.profile) return;
  const st = set();
  if (act === "voice"){ st.voice = el.value; saveProfile(); }
  if (act === "pc-url" || act === "pc-ref" || act === "pc-reftext" || act === "pc-reflang"){
    const k = {"pc-url":"url", "pc-ref":"ref", "pc-reftext":"refText", "pc-reflang":"refLang"}[act];
    st.pcVoice = Object.assign({}, st.pcVoice, {[k]:el.value.trim()}); TTS.cache.clear(); saveProfile();
  }
  if (act === "pocket-voice"){
    st.pocketVoice = Object.assign({}, st.pocketVoice, {voice:el.value.trim()}); TTS.pocketReset(); saveProfile();
  }
  if (act === "rate"){ st.rate = Number(el.value); saveProfile(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "rate"){ const v = $("#rate-v"); if (v) v.textContent = Number(e.target.value).toFixed(1) + "×"; }
  if (e.target.id === "theme-custom" && S.pick){ S.pick.custom = e.target.value; if (e.target.value.trim() && S.pick.sel >= 0){ S.pick.sel = -1; document.querySelectorAll('.theme-btn[aria-pressed="true"]').forEach(b => b.setAttribute("aria-pressed", "false")); } }
  if (e.target.id === "talk-input"){ e.target.style.height = "auto"; e.target.style.height = Math.min(140, e.target.scrollHeight) + "px"; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.dd){ S.dd = null; render(); return; }
  if (e.key === "Escape"){ if (!$("#dialog").hidden) return; if (S.sheet) closeSheet(); else if (S.reader) closeReader(); }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "talk-input" && !e.isComposing){ e.preventDefault(); sendTalk(); }
});
window.addEventListener("hashchange", () => {
  const v = location.hash.slice(1);
  if (S.profile && ["today","week","talk","words","prefs"].includes(v) && v !== S.view){ if (S.reader) closeReader(); S.view = v; render(); }
});

/* =========================================================
   Boot
   ========================================================= */
async function loadAll(){
  const p = await Store.get("profile");
  if (!p) return;
  const base = defaultSettings();
  p.settings = Object.assign(base, p.settings || {});
  p.settings.models = Object.assign(defaultSettings().models, (p.settings && p.settings.models) || {});
  const [weeks, arts, convs, words] = await Promise.all([Store.list("week"), Store.list("art"), Store.list("conv"), Store.list("word")]);
  S.weeks = {}; weeks.forEach(w => { delete w._id; S.weeks[w.n] = w; });
  S.arts = {}; arts.forEach(a => { delete a._id; S.arts[artId(a)] = a; });
  S.convs = {}; convs.forEach(c => { delete c._id; S.convs[c.week] = c; });
  S.bank = {}; words.forEach(x => { const id = x._id.replace(/^word-/, ""); delete x._id; S.bank[id] = x; });
  S.log = (await Store.get("log")) || {kind:"log", days:{}};
  S.wallet = Object.assign(newWallet(), (await Store.get("wallet")) || {});
  if (!S.log.days) S.log.days = {};
  if (!S.weeks[p.currentWeek]){ const ns = Object.keys(S.weeks).map(Number); p.currentWeek = ns.length ? Math.max.apply(null, ns) : 0; }
  S.profile = p;
}
async function boot(){
  const v = location.hash.slice(1);
  if (["today","week","talk","words","prefs"].includes(v)) S.view = v;
  S.mode = lsOk() ? "local" : "memory";
  try { await loadAll(); } catch (e) {}
  render();
}
boot();

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
